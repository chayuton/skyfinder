name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every step tees its output to a log, and a failing job posts the tail of that
# log as a commit comment. The raw Actions log lives on storage this project's
# tooling cannot reach, so without this a red build says nothing about why.
permissions:
  contents: write

jobs:
  analyze:
    name: วิเคราะห์โค้ดและรันเทสต์
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version 2>&1 | tee -a /tmp/ci.log
      - name: prepare platforms
        run: |
          set -o pipefail
          ./tool/prepare_platforms.sh android,web 2>&1 | tee -a /tmp/ci.log
      - name: pub get
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a /tmp/ci.log
      - name: flutter analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee -a /tmp/ci.log
      - name: flutter test
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee -a /tmp/ci.log
      - name: report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/report_failure.sh "${{ github.job }}"

  android:
    name: สร้าง APK
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: build apk
        run: |
          set -o pipefail
          ./tool/prepare_platforms.sh android 2>&1 | tee -a /tmp/ci.log
          flutter pub get 2>&1 | tee -a /tmp/ci.log
          flutter build apk --release 2>&1 | tee -a /tmp/ci.log
      - uses: actions/upload-artifact@v4
        with:
          name: skyfinder-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/report_failure.sh "${{ github.job }}"

  web:
    name: สร้างเว็บ
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Run the very script Vercel runs, pointed at the Flutter the runner
      # already has, so the deploy path itself is under test rather than a
      # lookalike sequence of commands.
      - name: build web through the Vercel script
        run: |
          set -o pipefail
          export FLUTTER_HOME="$(dirname "$(dirname "$(command -v flutter)")")"
          echo "FLUTTER_HOME=$FLUTTER_HOME" | tee -a /tmp/ci.log
          bash tool/vercel_build.sh 2>&1 | tee -a /tmp/ci.log
      - name: check the web overlay actually landed
        run: |
          set -o pipefail
          python3 tool/check_web_output.py build/web 2>&1 | tee -a /tmp/ci.log
      - uses: actions/upload-artifact@v4
        with:
          name: skyfinder-web
          path: build/web
          if-no-files-found: error
      - name: report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/report_failure.sh "${{ github.job }}"

  ios:
    name: สร้าง iOS (ไม่เซ็นใบรับรอง)
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: build ios
        run: |
          set -o pipefail
          ./tool/prepare_platforms.sh ios 2>&1 | tee -a /tmp/ci.log
          flutter pub get 2>&1 | tee -a /tmp/ci.log
          flutter build ios --release --no-codesign 2>&1 | tee -a /tmp/ci.log
      - name: report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/report_failure.sh "${{ github.job }}"
